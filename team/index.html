<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>График смен — команда</title><meta name="description" content="Недельный график работы шести сотрудников: два рабочих дня, два выходных.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c55db'/%3E%3Cpath d='M8 10h16v15H8z' fill='white'/%3E%3Cpath d='M11 6v8m10-8v8' stroke='white' stroke-width='3'/%3E%3Cpath d='m12 20 3 3 6-7' fill='none' stroke='%231c55db' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#14243e;background:#f3f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:0 auto;padding:44px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:15px}.logo{display:grid;place-items:center;background:#1c55db;color:white;width:48px;height:48px;border-radius:13px;font-size:20px;font-weight:750}h1{font-size:28px;letter-spacing:-.8px;margin:0}.sub{font-size:14px;color:#64748b;margin-top:5px}.mode{font-size:14px;border:1px solid #d5deeb;padding:9px 13px;border-radius:30px;background:white;white-space:nowrap}.today-area{background:#132c52;color:white;border-radius:18px;padding:25px 28px;margin-bottom:28px}.eyebrow{color:#bccde5;font-size:14px;margin-bottom:8px}.today-area h2{font-size:23px;margin:0 0 22px;letter-spacing:-.4px}.summaries{display:grid;grid-template-columns:1fr 1fr;gap:28px}.summary-label{font-size:14px;color:#b5c9e4;margin-bottom:11px;display:flex;align-items:center;gap:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#58dfb0}.dot.off{background:#a9b7ca}.names{display:flex;flex-wrap:wrap;gap:8px}.name{font-size:16px;background:#244267;border:1px solid #38567c;border-radius:7px;padding:7px 11px}.offnames .name{background:transparent;color:#d3deed}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.toolbar h2{font-size:20px;margin:0}.year{color:#64748b;font-size:14px;margin-top:5px}.controls{display:flex;gap:7px}button{font:inherit;font-size:14px;background:white;border:1px solid #d5deeb;border-radius:9px;height:42px;min-width:44px;padding:0 14px;color:#243852;cursor:pointer}button:hover{background:#e8efff;border-color:#a2b9ed}button:focus-visible,.scroll:focus-visible{outline:3px solid #1c55db;outline-offset:3px}.arrow{font-size:22px;padding:0 13px}.scroll{overflow-x:auto;border:1px solid #dce3ed;border-radius:14px;background:white}table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:770px}th,td{text-align:center;border-bottom:1px solid #e8edf4;padding:18px 8px}thead th{height:102px;font-weight:500;background:#fafbfd;color:#697a91;font-size:14px}thead th:first-child{text-align:left;padding-left:22px;width:190px}tbody th{text-align:left;padding-left:22px;font-size:16px;font-weight:600;background:white;position:sticky;left:0;z-index:2;border-right:1px solid #eef1f6}thead th:first-child{position:sticky;left:0;z-index:3}tr:last-child>*{border-bottom:0}.date{display:block;font-size:22px;font-weight:650;color:#263b56;margin-top:5px}.today-tag{display:block;color:#1c55db;font-size:12px;font-weight:650;margin-top:3px}.current{background:#eff4ff;border-left:2px solid #3870ed;border-right:2px solid #3870ed}thead .current{border-top:2px solid #3870ed;padding-top:16px}tbody tr:last-child .current{border-bottom:2px solid #3870ed}.work{display:inline-block;color:#096b4e;background:#e0f5ed;border:1px solid #c7ebdc;font-size:14px;font-weight:600;padding:8px 10px;border-radius:7px}.rest{color:#8592a5;font-size:14px}.legend{display:flex;gap:20px;flex-wrap:wrap;color:#67778d;font-size:14px;margin-top:17px}.key{display:inline-flex;align-items:center;gap:7px}.square{width:12px;height:12px;border-radius:3px;background:#e0f5ed;border:1px solid #9bd7bd}.square.gray{background:#f1f3f7;border-color:#d2dae6}.footer{font-size:13px;color:#7c899b;margin-top:28px;line-height:1.6}noscript{display:block;padding:20px;background:#fff2ce}@media(max-width:650px){main{padding:24px 14px}header{margin-bottom:20px}.logo{width:40px;height:40px;font-size:17px}.brand{gap:10px}h1{font-size:23px}.mode{padding:7px 10px}.today-area{padding:21px 18px;border-radius:14px}.today-area h2{font-size:21px}.summaries{grid-template-columns:1fr;gap:19px}.toolbar{align-items:flex-start;flex-wrap:wrap}.toolbar h2{font-size:18px}.controls{margin-left:auto}table{min-width:724px}thead th:first-child{width:154px}tbody th,thead th:first-child{padding-left:14px}tbody th{font-size:14px}.name{font-size:14px}.footer{margin-top:20px}}

<body><main>
<header><div class="brand"><div class="logo" aria-hidden="true">2/2</div><div><h1>График смен</h1><div class="sub">Команда · 6 сотрудников</div></div></div><span class="mode">Два через два</span></header>
<section class="today-area" aria-labelledby="today-title"><div class="eyebrow">СЕГОДНЯ</div><h2 id="today-title"></h2><div class="summaries"><div><div class="summary-label"><span class="dot"></span><span id="working-count"></span></div><div class="names" id="working"></div></div><div><div class="summary-label"><span class="dot off"></span><span id="resting-count"></span></div><div class="names offnames" id="resting"></div></div></div></section>
<section aria-label="Расписание на неделю"><div class="toolbar"><div aria-live="polite"><h2 id="week-label"></h2><div class="year" id="week-year"></div></div><nav class="controls" aria-label="Выбор недели"><button class="arrow" id="prev" aria-label="Предыдущая неделя">‹</button><button id="now">Сегодня</button><button class="arrow" id="next" aria-label="Следующая неделя">›</button></nav></div><div class="scroll" tabindex="0" role="region" aria-label="Таблица смен. На узком экране прокручивается вправо"><table aria-label="График сотрудников на неделю"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="legend"><span class="key"><span class="square"></span>Смена — рабочий день</span><span class="key"><span class="square gray"></span>Выходной — отдых</span></div></section>
<div class="footer">График 2/2, без переносов и подмен. Даты — по московскому времени.</div><noscript>Включите JavaScript, чтобы увидеть расписание.</noscript>
</main><script>
'use strict';
const DAY=86400000;
const staff=[['Кирилл Х','2026-09-27'],['Алена Ф','2026-09-29'],['Евгений А','2026-09-28'],['Денис М','2026-09-28'],['Алексей К','2026-09-26'],['Валерий Б','2026-09-26']].map(([name,start])=>({name,start:Date.parse(start+'T00:00:00Z')/DAY}));
function moscowDay(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>p.find(x=>x.type===t).value;return Date.parse(`${get('year')}-${get('month')}-${get('day')}T00:00:00Z`)/DAY;}
function phase(person,day){return ((day-person.start)%4+4)%4;}
function monday(day){return day-(new Date(day*DAY).getUTCDay()+6)%7;}
function fmt(day,options){return new Intl.DateTimeFormat('ru-RU',{timeZone:'UTC',...options}).format(new Date(day*DAY));}
let today=moscowDay(),week=monday(today);
function summary(){document.getElementById('today-title').textContent=fmt(today,{day:'numeric',month:'long',weekday:'long'});for(const [id,working] of [['working',true],['resting',false]]){const people=staff.filter(p=>(phase(p,today)<2)===working);document.getElementById(id+'-count').textContent=(working?'Работают':'Отдыхают')+' · '+people.length;document.getElementById(id).innerHTML=people.map(p=>`<span class="name">${p.name}</span>`).join('');}}
function render(){document.getElementById('week-label').textContent=fmt(week,{day:'numeric',month:'long'})+' — '+fmt(week+6,{day:'numeric',month:'long'});const a=fmt(week,{year:'numeric'}),b=fmt(week+6,{year:'numeric'});document.getElementById('week-year').textContent=a===b?a:a+' / '+b;const days=Array.from({length:7},(_,i)=>week+i);document.getElementById('head').innerHTML='<tr><th scope="col">Сотрудник</th>'+days.map(d=>`<th scope="col" class="${d===today?'current':''}" ${d===today?'aria-current="date"':''}>${fmt(d,{weekday:'short'})}<span class="date">${fmt(d,{day:'numeric'})}</span>${d===today?'<span class="today-tag">Сегодня</span>':''}</th>`).join('')+'</tr>';document.getElementById('body').innerHTML=staff.map(p=>'<tr><th scope="row">'+p.name+'</th>'+days.map(d=>{const n=phase(p,d);return `<td class="${d===today?'current':''}"><span class="${n<2?'work':'rest'}" title="${n%2+1}-й ${n<2?'рабочий':'выходной'} день">${n<2?'Смена':'Выходной'}</span></td>`;}).join('')+'</tr>').join('');}
document.getElementById('prev').onclick=()=>{week-=7;render();};document.getElementById('next').onclick=()=>{week+=7;render();};document.getElementById('now').onclick=()=>{today=moscowDay();week=monday(today);summary();render();document.querySelector('thead .current')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});};
function refreshDate(){const fresh=moscowDay();if(fresh!==today){const wasCurrent=week===monday(today);today=fresh;if(wasCurrent)week=monday(today);summary();render();}}
summary();render();setInterval(refreshDate,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDate();});
</script></body></html>
