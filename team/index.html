<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909"><meta name="color-scheme" content="dark">
<title>График смен — команда</title><meta name="description" content="Недельный график работы шести сотрудников: два рабочих дня, два выходных.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b9ed87'/%3E%3Cpath d='M8 10h16v15H8z' fill='%23090909'/%3E%3Cpath d='M11 6v8m10-8v8' stroke='%23090909' stroke-width='3'/%3E%3Cpath d='m12 20 3 3 6-7' fill='none' stroke='%23b9ed87' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#141414;--line:#292929;--muted:#aaa;--text:#f2f2ee;--accent:#b9ed87;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:32px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;background:var(--accent);color:#151d0f;border-radius:12px;font-size:18px;font-weight:750}h1{font-size:26px;letter-spacing:-.04em;margin:0}.sub,.mode,.year{color:var(--muted);font-size:14px}.sub{margin-top:4px}.mode{white-space:nowrap}
.today-area{margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--accent);margin-bottom:10px}.today-area h2{font-size:26px;letter-spacing:-.025em;margin:0 0 20px}.summaries{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summaries>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.summary-label{display:flex;gap:8px;align-items:center;font-size:14px;color:#ccc;margin-bottom:12px}.dot{width:8px;height:8px;border-radius:50%;background:#ddd;flex-shrink:0}.dot.off{background:var(--accent)}.names{display:flex;flex-wrap:wrap;gap:6px}.name{font-size:16px;line-height:1.5;color:var(--text);background:#242424;border:1px solid #363636;border-radius:7px;padding:5px 9px}.offnames .name{background:#1c2517;border-color:#34432b;color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.toolbar h2{font-size:21px;letter-spacing:-.025em;margin:0}.year{margin-top:5px}.controls{display:flex;gap:8px}button{font:inherit;font-size:14px;background:#1e1e1e;border:1px solid #363636;color:var(--text);border-radius:9px;min-height:44px;min-width:44px;padding:8px 14px;cursor:pointer;touch-action:manipulation}button:hover{background:#303030}button:focus-visible,.scroll:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.arrow{font-size:24px;line-height:1;padding:8px 14px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);scrollbar-color:#555 #141414}table{width:100%;min-width:44rem;table-layout:fixed;border-collapse:separate;border-spacing:0}th,td{padding:16px 5px;text-align:center;border-bottom:1px solid var(--line)}thead th{height:90px;font-size:14px;font-weight:500;color:var(--muted);background:#171717}thead th:first-child{width:166px;text-align:left;padding-left:18px;position:sticky;left:0;z-index:3}tbody th{font-size:16px;font-weight:600;text-align:left;padding-left:18px;position:sticky;left:0;z-index:2;background:var(--panel);border-right:1px solid var(--line)}tr:last-child>*{border-bottom:0}.date{display:block;font-size:21px;font-weight:650;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums}.today-tag{display:block;color:var(--accent);font-size:12px;font-weight:650;margin-top:4px}.current{background:#20291a;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}thead .current{border-top:2px solid var(--accent)}tbody tr:last-child .current{border-bottom:2px solid var(--accent)}.work,.rest{display:inline-block;font-size:14px;font-weight:600;border-radius:7px;padding:8px 7px;border:1px solid #414141;background:#282828;color:#f2f2ee}.rest{color:var(--accent);background:#1c2517;border-color:#3a4c2d}.short{display:none}.legend{display:flex;gap:12px 22px;flex-wrap:wrap;font-size:14px;color:#bbb;line-height:1.5;margin-top:16px}.key{display:inline-flex;align-items:center;gap:7px}.square{width:11px;height:11px;border-radius:3px;background:#777;flex-shrink:0}.square.gray{background:var(--accent)}.footer{color:var(--muted);font-size:13px;line-height:1.6;margin-top:26px}noscript{display:block;background:#372900;color:#fff0c3;padding:20px}
@media(max-width:700px){main{padding:20px 10px}header{padding-bottom:18px;margin-bottom:22px}.brand{gap:10px}.logo{width:40px;height:40px;font-size:17px}h1{font-size:23px}.mode{display:none}.today-area h2{font-size:22px;line-height:1.35;margin-bottom:16px}.summaries{gap:8px}.summaries>div{padding:12px 10px}.names{display:grid;gap:4px}.name{font-size:14px;padding:3px 6px;overflow-wrap:anywhere}.summary-label{font-size:14px;gap:6px;margin-bottom:9px}.today-area{margin-bottom:24px}.toolbar{flex-wrap:wrap;gap:12px}.toolbar>div{width:100%}.toolbar h2{font-size:20px}.controls{width:100%;display:grid;grid-template-columns:48px 1fr 48px;gap:10px}button{min-height:46px;font-size:16px}
table{min-width:20rem}thead th:first-child{width:6.1rem;padding-left:8px;font-size:13px}tbody th{padding-left:8px;font-size:14px;line-height:1.4;overflow-wrap:normal}th,td{padding:13px 1px}thead th{font-size:14px;height:78px}.date{font-size:16px;margin-top:4px}.today-tag{font-size:0;height:6px;margin-top:5px}.today-tag::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:auto}.current{border-left-width:1px;border-right-width:1px}.long{display:none}.short{display:inline}.work,.rest{font-size:14px;padding:5px 0;width:1.6rem;line-height:1.25;border-radius:5px}.legend{gap:8px 15px;margin-top:13px}.footer{margin-top:20px}.scroll{border-radius:10px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head>
<body><main>
<header><div class="brand"><div class="logo" aria-hidden="true">2/2</div><div><h1>График смен</h1><div class="sub">Команда · 6 сотрудников</div></div></div><span class="mode">Два через два</span></header>
<section class="today-area" aria-labelledby="today-title"><div class="eyebrow">СЕГОДНЯ</div><h2 id="today-title"></h2><div class="summaries"><div><div class="summary-label"><span class="dot"></span><span id="working-count"></span></div><div class="names" id="working"></div></div><div><div class="summary-label"><span class="dot off"></span><span id="resting-count"></span></div><div class="names offnames" id="resting"></div></div></div></section>
<section aria-label="Расписание на неделю"><div class="toolbar"><div aria-live="polite"><h2 id="week-label"></h2><div class="year" id="week-year"></div></div><nav class="controls" aria-label="Выбор недели"><button class="arrow" id="prev" aria-label="Предыдущая неделя">‹</button><button id="now">Сегодня</button><button class="arrow" id="next" aria-label="Следующая неделя">›</button></nav></div><div class="scroll" tabindex="0" role="region" aria-label="Таблица смен. На узком экране прокручивается вправо"><table aria-label="График сотрудников на неделю"><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="legend"><span class="key"><span class="square"></span>Р — рабочий день</span><span class="key"><span class="square gray"></span>В — выходной</span></div></section>
<div class="footer">График 2/2, без переносов и подмен. Сегодняшний столбец выделен рамкой. Время — московское.</div><noscript>Включите JavaScript, чтобы увидеть расписание.</noscript>
</main><script>
'use strict';
const DAY=86400000;
const staff=[['Кирилл Х','2026-09-27'],['Алена Ф','2026-09-29'],['Евгений А','2026-09-28'],['Денис М','2026-09-28'],['Алексей К','2026-09-26'],['Валерий Б','2026-09-26']].map(([name,start])=>({name,start:Date.parse(start+'T00:00:00Z')/DAY}));
function moscowDay(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>p.find(x=>x.type===t).value;return Date.parse(`${get('year')}-${get('month')}-${get('day')}T00:00:00Z`)/DAY;}
function phase(person,day){return ((day-person.start)%4+4)%4;}
function monday(day){return day-(new Date(day*DAY).getUTCDay()+6)%7;}
function fmt(day,options){return new Intl.DateTimeFormat('ru-RU',{timeZone:'UTC',...options}).format(new Date(day*DAY));}
let today=moscowDay(),week=monday(today);
function summary(){document.getElementById('today-title').textContent=fmt(today,{day:'numeric',month:'long',weekday:'long'});for(const [id,working] of [['working',true],['resting',false]]){const people=staff.filter(p=>(phase(p,today)<2)===working);document.getElementById(id+'-count').textContent=(working?'Работают':'Отдыхают')+' · '+people.length;document.getElementById(id).innerHTML=people.map(p=>`<span class="name">${p.name}</span>`).join('');}}
function render(){document.getElementById('week-label').textContent=fmt(week,{day:'numeric',month:'long'})+' — '+fmt(week+6,{day:'numeric',month:'long'});const a=fmt(week,{year:'numeric'}),b=fmt(week+6,{year:'numeric'});document.getElementById('week-year').textContent=a===b?a:a+' / '+b;const days=Array.from({length:7},(_,i)=>week+i);document.getElementById('head').innerHTML='<tr><th scope="col">Сотрудник</th>'+days.map(d=>`<th scope="col" class="${d===today?'current':''}" ${d===today?'aria-current="date"':''}>${fmt(d,{weekday:'short'})}<span class="date">${fmt(d,{day:'numeric'})}</span>${d===today?'<span class="today-tag">Сегодня</span>':''}</th>`).join('')+'</tr>';document.getElementById('body').innerHTML=staff.map(p=>'<tr><th scope="row">'+p.name+'</th>'+days.map(d=>{const n=phase(p,d);return `<td class="${d===today?'current':''}"><span class="${n<2?'work':'rest'}" aria-label="${n<2?'Рабочий день':'Выходной'}" title="${n%2+1}-й ${n<2?'рабочий':'выходной'} день">${n<2?'<span class="long">Смена</span><span class="short" aria-hidden="true">Р</span>':'<span class="long">Выходной</span><span class="short" aria-hidden="true">В</span>'}</span></td>`;}).join('')+'</tr>').join('');}
document.getElementById('prev').onclick=()=>{week-=7;render();};document.getElementById('next').onclick=()=>{week+=7;render();};document.getElementById('now').onclick=()=>{today=moscowDay();week=monday(today);summary();render();document.querySelector('thead .current')?.scrollIntoView({block:'nearest',inline:'center'});};
function refreshDate(){const fresh=moscowDay();if(fresh!==today){const wasCurrent=week===monday(today);today=fresh;if(wasCurrent)week=monday(today);summary();render();}}
summary();render();setInterval(refreshDate,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDate();});
</script></body></html>
